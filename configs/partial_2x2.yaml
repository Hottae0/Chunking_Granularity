experiment:
  name: server_novel5_allq_2x2
  sizes: [128, 256]
  overlap_ratio: 0.0
  context_tokens: 4096
  evidence_tokens: 2048
  community_level: 2
  seed: 42
  # Keep the same five seeded novels and every query used by the server run.
  max_documents: 5
  document_selection: seeded_random
  max_questions_per_document: null
  retries: 3
  retry_delay_seconds: 2
  workers: 1
  indexing_concurrency: 2
  backend: official

data:
  root: data/GraphRAG-Bench
  questions: Datasets/Questions/novel_questions.json
  corpus: Datasets/Corpus/novel.json
  output: runs/server_novel5_allq_2x2
  graph_store: runs/_graph_store/novel5_seed42_qwen25_bge_m3
