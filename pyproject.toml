[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-chunk-rq1"
version = "0.1.0"
description = "Dual segmentation factorial experiment for MS GraphRAG Local Search"
requires-python = ">=3.11"
dependencies = ["graphrag>=3.0,<4", "pandas>=2.2", "pyarrow>=15", "PyYAML>=6", "python-dotenv>=1", "tiktoken>=0.7", "matplotlib>=3.8", "openai>=1.50"]

[project.scripts]
rq1-grid = "rq1.experiments.run_grid:main"
rq1-bootstrap = "rq1.experiments.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
